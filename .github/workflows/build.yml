name: Build XianyuMon deb (roothide)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install roothide Theos
        run: |
          export THEOS=$HOME/theos
          # 用 roothide 官方的 theos 仓库（关键！不是标准 theos）
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          brew install ldid dpkg make || true

      - name: Download iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS*.sdk $THEOS/sdks/ 2>/dev/null || true
          ls -la $THEOS/sdks

      - name: Fix postinst permissions
        run: chmod 0755 layout/DEBIAN/postinst

      - name: Build package (roothide scheme)
        run: |
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xianyumon-deb-roothide
          path: packages/*.deb
          if-no-files-found: error
